[project]
name = "steemer"
version = "0.0.0"
description = "Autonomous bot + self-improvement harness for BotGuilds (guild Stanley_Steemer)"
readme = "README.md"
requires-python = ">=3.15"
authors = [{ name = "Caleb L. Power", email = "cpower@axonibyte.com" }]
dependencies = [
    "pyzmq>=26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steemer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
