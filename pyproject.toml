[project]
name = "steemer"
version = "0.0.0"
description = "Autonomous bot + self-improvement harness for BotGuilds (guild Stanley_Steemer)"
readme = "README.md"
# Floor at 3.12: the code uses nothing 3.15-specific, and pinning >=3.15 (an
# unreleased beta) makes the reaper container unbuildable — uv can't provision a
# 3.15 interpreter there. Locally uv keeps the existing 3.15 venv (it satisfies
# this), so the workstation still runs on 3.15; the container uses a stable one.
requires-python = ">=3.12"
authors = [{ name = "Caleb L. Power", email = "cpower@axonibyte.com" }]
dependencies = [
    "pyzmq>=26",
    # MariaDB backend driver (steemer.db). The import is lazy/guarded, so a
    # SQLite-only checkout still runs if this is somehow absent; it is a core dep
    # because config.toml selects the MariaDB backend by default.
    "mysql-connector-python>=8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
# Frontend (dashboard) tests via Playwright. Kept in a SEPARATE, non-default group:
# the workstation is FreeBSD, where Playwright browsers do not run, so local
# `uv sync` / `uv run pytest` must NOT pull these — the frontend tests importorskip
# and are collected only where the group is installed. The reaper gate (Linux
# container) installs it with `uv sync --group frontend` + `playwright install
# chromium`, so the DASHBOARD is exercised in the pinned gate even though it can't be
# run locally.
frontend = [
    "playwright>=1.40",
    "pytest-playwright>=0.5",
]
# ML training (the offline pipeline of docs/plan glistening-baking-lagoon). Linux-only,
# NEVER default-synced: the FreeBSD workstation has no wheels for these and the live bot
# must stay stdlib-only for scoring (steemer/models.py walks exported JSON trees). Only
# the reaper training session (`--manifest .reaper-train.toml`) installs this group.
train = [
    "scikit-learn>=1.5",
    "numpy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steemer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
